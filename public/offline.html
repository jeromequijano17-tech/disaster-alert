<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - Municipal Disaster Alert</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="center"><div class="wrap">
    <div class="brand"><h1>MUNICIPAL DISASTER ALERT</h1></div>
    <div class="card">
      <h2>You are offline</h2>
      <p>This page could not be loaded because there is no internet connection.</p>
      <p>If you have opened the app before, your most recent alerts may still be available. In an emergency, follow instructions from local authorities and call your local emergency hotline.</p>
      <button class="btn block" id="retry" type="button">Try again</button>
    </div>
  </div></main>
  <script src="/js/offline.js"></script>
</body>
</html>
