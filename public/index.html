<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Municipal Disaster Alert</title>
  <meta name="theme-color" content="#c62828">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="center">
    <div class="wrap">
      <div class="brand">
        <h1>MUNICIPAL DISASTER ALERT</h1>
        <p class="muted">Official alerts for residents</p>
      </div>

      <div id="offline" class="notice offline hidden">You are offline. Connect to the internet to log in.</div>

      <div class="card">
        <div class="tabs" role="tablist">
          <button id="tab-login" role="tab" aria-selected="true">Log in</button>
          <button id="tab-register" role="tab" aria-selected="false">Register</button>
        </div>

        <form id="login-form" novalidate>
          <label for="l-email">Email</label>
          <input id="l-email" type="email" autocomplete="username" required>
          <label for="l-pass">Password</label>
          <input id="l-pass" type="password" autocomplete="current-password" required>
          <button class="btn block" type="submit">Log in</button>
        </form>

        <form id="register-form" class="hidden" novalidate>
          <label for="r-name">Full name</label>
          <input id="r-name" type="text" autocomplete="name" maxlength="100" required>
          <label for="r-email">Email</label>
          <input id="r-email" type="email" autocomplete="email" required>
          <label for="r-pass">Password (at least 8 characters)</label>
          <input id="r-pass" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <button class="btn block" type="submit">Create resident account</button>
        </form>

        <div id="auth-msg" class="msg" role="alert"></div>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
